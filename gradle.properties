# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

## Environment Properties
# https://projects.neoforged.net/neoforged/neoforge
# Minecraft 26.1+ is no longer obfuscated: no mappings (Parchment) needed
minecraft_version=26.3
# 26.1, 26.1.1 and 26.1.2 (same jar)
minecraft_version_range=[26.3,)
neo_version=26.3.0.101
# Range for neoforge.mods.toml (oldest NeoForge for Minecraft 26.1)
neo_version_range=[26.3.0.0-beta,)

## Mod Properties
mod_id=knightarmorweapons
# Name for the jar file
mod_archives_name=KnightArmorWeapons
mod_name=Knight Armor and Weapons
mod_license=All Rights Reserved
mod_version=1.1.1-NeoForge-mc26.3
mod_group_id=net.petemc.knightarmorweapons
mod_authors=Pete MC Mods (mcmods.pete@gmail.com)
mod_description=This mod adds Knight Armor and Weapons to Minecraft.
