# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

## Environment Properties
# https://fabricmc.net/develop
minecraft_version=26.3
# Range for fabric.mod.json: all 26.1.x versions (26.1, 26.1.1, 26.1.2)
minecraft_version_range=~26.3
loader_version=0.20.1
# Minimum Fabric Loader required at runtime (fabric.mod.json), same minimum as the Fabric API for 26.1
loader_version_min=0.19.3
loom_version=1.19.3
fabric_version=0.165.2+26.3
# Minimum Fabric API required at runtime (fabric.mod.json): last build for 26.1 (tested); the APIs used here
# (creative tab, rendering v23) exist since 0.143.12+26.1
fabric_version_min=0.160.6

## Mod Properties
mod_id=knightarmorweapons
# Name for the jar file
mod_archives_name=KnightArmorWeapons
mod_name=Knight Armor and Weapons
mod_license=All Rights Reserved
mod_version=1.1.1-Fabric-mc26.3
mod_group_id=net.petemc.knightarmorweapons
mod_authors=Pete MC Mods
mod_contact_email=mcmods.pete@gmail.com
mod_description=This mod adds Knight Armor and Weapons to Minecraft.
